; FastLeafDecay - settings.ini
; Reload with "/fld reload" (in game) or by reloading the plugin.
; Use "Key=Value" without spaces: Cuberite stores key names verbatim, so "Key = Value"
; would be read as the key "Key " (the plugin also accepts that spelling as a fallback).

[General]
; Master switch. When false the plugin does nothing at all.
Enabled=true

; Maximum number of leaves steps between a leaves block and a log for the leaves to stay.
; Cuberite's built-in check uses 6 (LEAVES_CHECK_DISTANCE); keep the two in sync.
MaxDistance=6

; Safety valve: a decay pass that would visit more leaves than this is aborted and the
; work is left to Cuberite's own (slower) decay. Protects against pathological builds.
MaxScan=4096

; Safety valve: a decay pass that spreads further than this many blocks from the removed
; log is aborted. Must be between 4 and 63.
MaxRadius=32

; true  = orphaned leaves are removed with their normal drops (sapling / stick / apple,
;         HOOK_BLOCK_TO_PICKUPS still applies)
; false = orphaned leaves are removed without spawning any items
DropItems=true

; false = leaves placed by a player (meta bit 0x04) are never removed, matching Cuberite
; true  = those leaves decay as well
DecayPlacedLeaves=false

; After a decay pass, clear the "needs a decay check" bit (meta 0x08) on the surviving
; leaves. They are known to be in reach of a log, so this skips a lot of pointless
; 13x13x13 scans in Cuberite's own handler.
ClearNativeCheckBit=true

; Log one line per decay pass. Useful while tuning, noisy on a busy server.
Debug=false

; false = every orphaned leaf is removed inside the same tick (instant, can look abrupt).
; true  = the orphaned leaves go into a per-world queue and are removed in small batches,
;         so the canopy crumbles away over a moment instead of vanishing in one frame.
Gradual=true

; Gradual mode: ticks between two batches (1 tick = 50 ms).
DecayIntervalTicks=2

; Gradual mode: leaves removed per batch. 6 leaves every 2 ticks clears a 68-leaf canopy
; in a little over a second.
LeavesPerBatch=6

; Cuberite's vine handler never destroys a vine whose meta has already been reduced to 0
; (a vine held only by the solid block above it, e.g. a leaf), so such vines keep floating
; after the canopy is gone. With this enabled the plugin re-checks the vines around every
; leaf it removes and clears the ones that lost their support.
CleanFloatingVines=true


[Features]
; React to logs broken by a player (the normal case).
EnableOnPlayerBreak=true

; React to logs removed by explosions. Off by default: every explosion in range triggers
; an extra scan of the blast area.
EnableOnExplosion=false

; Explosion scans cover (explosion size + this) blocks around the center.
ExplosionRadiusBoost=2

; Hard cap on the explosion scan radius (the cost grows with its cube).
ExplosionMaxRadius=8
